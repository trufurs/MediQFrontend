<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradient-q" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gradient-cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer ring Q with a gap at bottom-right for the tail -->
  <path d="M 50 12 A 38 38 0 1 0 76.8 76.8" fill="none" stroke="url(#gradient-q)" stroke-width="8" stroke-linecap="round" />
  <!-- Tail of Q -->
  <path d="M 68 68 L 88 88" fill="none" stroke="url(#gradient-q)" stroke-width="8" stroke-linecap="round" />
  <!-- Glow ring -->
  <path d="M 50 12 A 38 38 0 1 0 76.8 76.8" fill="none" stroke="#06b6d4" stroke-width="4" opacity="0.3" filter="url(#glow)" />
  <!-- Medical Cross in Center -->
  <path d="M 44 34 H 56 V 44 H 66 V 56 H 56 V 66 H 44 V 56 H 34 V 44 H 44 Z" fill="url(#gradient-cross)" filter="url(#glow)" />
</svg>
